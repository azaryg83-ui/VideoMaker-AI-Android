name: Build VideoMaker AI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        run: |
          mkdir project
          unzip -q VideoMaker_AI_Android_Scaffold_34.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          text = gradle_file.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          gradle_file.write_text(text)
          print("Java and Kotlin JVM targets set to 17")
          PY

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoMaker-AI-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
